[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["UP007", "UP035"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed_demo.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
