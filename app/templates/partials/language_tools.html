<div class="language-switcher" aria-label="{{ _('Language') }}">
    <span>{{ _('Language') }}</span>
    <a href="{{ language_url('en') }}" class="{% if current_language() == 'en' %}active{% endif %}">EN</a>
    <a href="{{ language_url('ru') }}" class="{% if current_language() == 'ru' %}active{% endif %}">RU</a>
</div>
<script>
    window.APP_I18N = {
        lang: {{ current_language()|tojson }},
        translations: {{ translations()|tojson }}
    };
</script>
<script src="{{ url_for('static', path='js/i18n.js') }}?v=20260701-status-values" defer></script>
